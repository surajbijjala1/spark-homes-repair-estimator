/* ── Spark Homes design tokens ───────────────────────────────────── */
:root{
  --color-terracotta:#8C3B26; --color-terracotta-dark:#6E2E1D; --color-terracotta-light:#A85338;
  --color-forest:#2E4A3D; --color-forest-dark:#22392F; --color-forest-light:#3E5F4F;
  --color-sandstone:#E4C9A0; --color-sandstone-dark:#D6B685;
  --color-charcoal:#3A3532; --color-charcoal-70:rgba(58,53,50,.7); --color-charcoal-45:rgba(58,53,50,.45); --color-charcoal-15:rgba(58,53,50,.15);
  --color-cream:#F7F2EA; --color-cream-dim:#EFE7D9; --color-white:#FFF;
  --color-success:#3E6B4C; --color-warning:#B8863A; --color-danger:#A8412A;
  --bg-page:var(--color-cream); --bg-surface:var(--color-white); --bg-surface-warm:var(--color-sandstone); --bg-surface-sunken:var(--color-cream-dim);
  --text-primary:var(--color-charcoal); --text-secondary:var(--color-charcoal-70); --text-muted:var(--color-charcoal-45);
  --text-on-accent:var(--color-cream); --text-on-dark:var(--color-cream);
  --accent-primary:var(--color-terracotta); --accent-primary-hover:var(--color-terracotta-dark);
  --accent-secondary:var(--color-forest); --accent-secondary-hover:var(--color-forest-dark);
  --border-subtle:var(--color-charcoal-15); --border-strong:var(--color-charcoal-45); --focus-ring:var(--color-forest);
  --font-display:'Space Grotesk',sans-serif; --font-body:'Work Sans',sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:999px;
  --shadow-sm:0 1px 2px rgba(58,53,50,.08); --shadow-md:0 4px 12px rgba(58,53,50,.10);
  --tap:48px; --tracking-wide:.04em;
}

/* ── Base ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button{font-family:var(--font-body);cursor:pointer}
input,select{font-family:var(--font-body);font-size:16px;color:var(--text-primary)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
h1,h2,h3{font-family:var(--font-display);margin:0}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Shell ───────────────────────────────────────────────────────── */
#shell{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg-page)}
header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 12px;background:var(--color-charcoal);color:var(--text-on-dark)}
header.bar .ttl{font-family:var(--font-display);font-weight:700;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .sub{font-size:11px;opacity:.65;font-weight:500}
.icbtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;color:var(--color-cream);border-radius:var(--radius-sm)}
.icbtn:active{background:rgba(247,242,234,.12)}
main#app{flex:1;display:flex;flex-direction:column}
footer.totalbar{position:sticky;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--color-charcoal);color:var(--text-on-dark);cursor:pointer}
footer.totalbar .lbl{font-size:12px;font-weight:600;letter-spacing:var(--tracking-wide);text-transform:uppercase;opacity:.7}
footer.totalbar .amt{font-family:var(--font-display);font-weight:700;font-size:26px}

/* ── Components ──────────────────────────────────────────────────── */
.pad{padding:16px}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 24px;border-radius:var(--radius-md);border:none;font-family:var(--font-display);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent-primary);color:var(--text-on-accent)}
.btn.primary:active{background:var(--accent-primary-hover)}
.btn.ghost{background:none;border:1px solid var(--border-subtle);color:var(--text-secondary);font-family:var(--font-body);font-size:14px}
.btn.dashed{background:none;border:2px dashed var(--border-subtle);color:var(--accent-primary);font-size:14px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;flex:1}
.field span{font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:var(--tracking-wide);text-transform:uppercase}
.field input{height:var(--tap);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0 14px;background:var(--bg-surface);width:100%}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.muted{color:var(--text-muted);font-size:13px}
.progresswrap{padding:12px 16px;background:var(--bg-surface-sunken)}
.progresstop{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:600}
.progressbar{height:6px;border-radius:var(--radius-full);background:var(--border-subtle);overflow:hidden}
.progressbar>div{height:100%;background:var(--accent-secondary);transition:width .2s ease-out}

/* rooms list */
.roomrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);text-align:left;margin-bottom:6px}
.roomrow.active{border:2px solid var(--accent-primary);padding:11px 13px}
.ring{position:relative;width:36px;height:36px;flex-shrink:0}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text-secondary)}
.roomrow .nm{font-weight:600;font-size:14px}
.roomrow .ct{font-size:12px;color:var(--text-muted);margin-top:2px}
.roomrow .tot{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent-primary)}
.rm-x{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:none;color:var(--text-muted);border-radius:var(--radius-sm)}

/* groups & items */
.group{margin-bottom:6px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-surface)}
.group>.ghead{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg-surface);border:none;font-size:14px;text-align:left;min-height:var(--tap)}
.group.done>.ghead{background:rgba(62,107,76,.08)}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--border-subtle);flex-shrink:0}
.group.done .gdot{background:var(--color-success)}
.ghead .gname{flex:1;font-weight:600}
.ghead .gtot{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent-primary)}
.ghead .chev{color:var(--text-muted);transition:transform .15s}
.group.open .chev{transform:rotate(180deg)}
.gbody{border-top:1px solid var(--border-subtle)}
.noaction{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border-subtle);cursor:pointer}
.noaction input{accent-color:var(--accent-secondary);width:18px;height:18px}
.item{padding:10px 14px;border-bottom:1px solid var(--border-subtle)}
.item:last-child{border-bottom:none}
.item .r1{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.item .inm{font-size:14px;font-weight:500;flex:1}
.item .ltot{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--accent-primary)}
.item .r2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden}
.stepper button{width:40px;height:40px;border:none;background:var(--bg-surface-sunken);color:var(--accent-primary);font-size:18px}
.stepper input{width:56px;height:40px;border:none;border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;background:var(--bg-surface)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:12px;color:var(--text-muted);min-width:34px}
.pricebtn{border:none;background:none;font-size:13px;color:var(--text-secondary);text-decoration:underline dotted;padding:4px 0}
.pricebtn.ovr{color:var(--color-warning);font-weight:600}
.pricebtn.glb{color:var(--color-forest);font-weight:600}
.ix{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:none;color:var(--text-muted);border-radius:var(--radius-sm)}
.ix:active{color:var(--color-danger)}
.addrow{width:100%;padding:12px 14px;border:none;background:none;font-size:13px;font-weight:600;color:var(--accent-primary);text-align:left}
.priceinput{width:80px;height:32px;border:1px solid var(--accent-primary);border-radius:4px;padding:0 8px;font-family:var(--font-display);font-size:13px}

/* projects home */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 20px 8px;text-align:center}
.hero img{width:min(280px,70%);height:auto}
.hero .tag{font-size:14px;color:var(--text-secondary)}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:8px}
.pcard .pn{font-family:var(--font-display);font-weight:700;font-size:16px}
.pcard .pa{font-size:12px;color:var(--text-muted);margin-top:2px}
.pcard .pt{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--accent-primary)}

/* photos */
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;background:var(--bg-surface-sunken)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(58,53,50,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .sn{position:absolute;bottom:0;left:0;right:0;background:rgba(58,53,50,.82);color:var(--color-cream);font-size:10px;padding:4px 6px;font-family:var(--font-display);font-weight:600;border:none;text-align:left;width:100%}
.ph .sc{position:absolute;bottom:4px;left:4px;background:rgba(58,53,50,.72);color:var(--color-cream);font-size:9px;padding:2px 6px;border-radius:var(--radius-full)}

/* summary */
.bigtotal{text-align:center;padding:18px 0 6px}
.bigtotal .n{font-family:var(--font-display);font-weight:700;font-size:42px;color:var(--accent-primary);line-height:1.1}
.sumrow{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle);font-size:14px}
.sumrow:last-child{border-bottom:none}
.sumrow b{font-family:var(--font-display);font-weight:700}

/* settings */
.setitem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);font-size:13px}
.setitem:last-child{border-bottom:none}
.setitem .sn2{flex:1}
.setitem .un{color:var(--text-muted);font-size:11px}
.setitem input{width:88px;height:36px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0 8px;text-align:right;font-family:var(--font-display);font-size:13px}
.setitem input.chg{border-color:var(--color-warning);color:var(--color-warning);font-weight:700}
.setitem .rst{border:none;background:none;color:var(--accent-primary);font-size:11px;font-weight:600;padding:4px}

/* modal */
#modalwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(58,53,50,.5)}
@media(min-width:600px){#modalwrap{align-items:center}}
.modal{background:var(--bg-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:20px}
@media(min-width:600px){.modal{border-radius:var(--radius-lg)}}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .mrow{display:flex;gap:8px;margin-top:16px}
.modal .mrow .btn{flex:1}
.modal select{width:100%;height:var(--tap);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0 10px;background:var(--bg-surface);margin-top:8px}
.tabs{display:flex;border-bottom:1px solid var(--border-subtle);margin:10px 0}
.tabs button{flex:1;height:44px;border:none;background:none;font-weight:700;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text-primary);border-bottom-color:var(--accent-primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:120;background:var(--color-charcoal);color:var(--color-cream);padding:10px 18px;border-radius:var(--radius-full);font-size:13px;box-shadow:var(--shadow-md);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

/* search */
.searchbar{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-surface);padding:0 12px;margin-bottom:10px}
.searchbar input{flex:1;border:none;height:42px;background:none;font-size:14px;min-width:0}
.searchbar input:focus{outline:none}
.searchbar svg.ic{width:16px;height:16px;color:var(--text-muted)}

/* focus styles that don't clip inside overflow:hidden containers */
.stepper input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus-ring)}
.priceinput:focus{outline:none;border-color:var(--focus-ring);box-shadow:0 0 0 2px rgba(46,74,61,.2)}

/* no-action groups read as "reviewed, nothing needed" — distinct from groups with repairs */
.group.noact>.ghead{background:var(--bg-surface-sunken)}
.group.noact .gname{color:var(--text-secondary)}
.nacheck{width:16px;height:16px;flex-shrink:0;color:var(--color-success)}

/* notes */
.noterow{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border:none;border-top:1px solid var(--border-subtle);background:var(--bg-surface-sunken);font-size:13px;color:var(--text-secondary);cursor:pointer;width:100%;text-align:left;font-family:var(--font-body)}
.noterow svg.ic{width:14px;height:14px;margin-top:1px;color:var(--text-muted);flex-shrink:0}
.noterow .empty{color:var(--text-muted)}
.notemark{display:inline-flex;margin-left:6px;color:var(--text-muted)}
.notemark svg.ic{width:13px;height:13px}
.notearea{width:100%;min-height:110px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--font-body);font-size:15px;background:var(--bg-surface);resize:vertical;box-sizing:border-box}

/* condition grades */
.graderow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary)}
.gradechip{width:38px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);background:var(--bg-surface);font-weight:700;font-size:13px;color:var(--text-muted)}
.gradechip.on-A{background:var(--color-forest);border-color:var(--color-forest);color:var(--color-cream)}
.gradechip.on-B{background:var(--color-forest-light);border-color:var(--color-forest-light);color:var(--color-cream)}
.gradechip.on-C{background:var(--color-warning);border-color:var(--color-warning);color:#fff}
.gradechip.on-D{background:var(--color-danger);border-color:var(--color-danger);color:#fff}
.gradepill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--radius-full);color:#fff;margin-left:6px}

/* budget states on the running-total bar */
footer.totalbar.warn .amt{color:#E8C77D}
footer.totalbar.over .amt{color:#F0A28E}
footer.totalbar .sublbl{display:block;font-size:11px;opacity:.65;font-weight:500;letter-spacing:0;text-transform:none;margin-top:2px}

/* walkthrough audit */
.auditrow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border:none;border-bottom:1px solid var(--border-subtle);background:none;font-size:13px;text-align:left;color:var(--text-primary);font-family:var(--font-body);cursor:pointer}
.auditrow:last-child{border-bottom:none}
.auditrow .big{color:var(--color-danger);font-weight:700}

/* cover photo */
.pcard img.cover{width:54px;height:54px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0}
.ph .coverbtn{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(58,53,50,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .coverbtn.on{background:var(--accent-primary)}
.ph .coverbtn svg.ic{width:14px;height:14px}

/* L×W dimension helper */
.lxw{border:1px solid var(--border-subtle);background:var(--bg-surface-sunken);border-radius:var(--radius-sm);font-size:11px;font-weight:700;color:var(--text-secondary);padding:8px 9px}

/* ── Desktop two-pane (≥900px) ───────────────────────────────────── */
@media(min-width:900px){
  #shell{max-width:1100px}
  .twopane{display:grid;grid-template-columns:360px 1fr;gap:0;flex:1;min-height:0}
  .twopane .rail{border-right:1px solid var(--border-subtle);overflow:auto}
  .twopane .pane{overflow:auto;background:var(--bg-surface-sunken)}
  .pane .panecard{margin:16px;background:var(--bg-page);border-radius:var(--radius-lg);padding:16px;border:1px solid var(--border-subtle)}
  .mobile-only{display:none!important}
}
@media(max-width:899px){
  .twopane .pane{display:none}
  .twopane.showpane .rail{display:none}
  .twopane.showpane .pane{display:block}
  .desk-only{display:none!important}
}
</style>
</head>

/* User-added catalog items (Settings → "Add item to price list"). Each carries the
   roomType+group it seeds into, so new projects/rooms include it automatically. */
let CUSTOM_CATALOG = [];
try { CUSTOM_CATALOG = JSON.parse(localStorage.getItem('sh_catalog_custom')) || []; } catch(e){}
/* ADOPTED: edited standard prices accepted as the new default (the ✓ in Settings).
   REMOVED: base CSV items deleted from the price list (restorable). */
let ADOPTED = {};
try { ADOPTED = JSON.parse(localStorage.getItem('sh_catalog_adopted')) || {}; } catch(e){}
let REMOVED = [];
try { REMOVED = JSON.parse(localStorage.getItem('sh_catalog_removed')) || []; } catch(e){}
const isCustomId = id => CUSTOM_CATALOG.some(x => x.id === id);
// self-heal: REMOVED is for base CSV items only — custom ids that ended up
// here (early-version bug) get pulled back out
REMOVED = REMOVED.filter(id => !isCustomId(id));
function fullCatalog(){ return CATALOG.filter(c => !REMOVED.includes(c.id)).concat(CUSTOM_CATALOG); }
let CAT = {};
function rebuildCat(){ CAT = Object.fromEntries(CATALOG.concat(CUSTOM_CATALOG).map(i => [i.id, i])); }
rebuildCat();
function saveCustomCatalog(){
  localStorage.setItem('sh_catalog_custom', JSON.stringify(CUSTOM_CATALOG));
  localStorage.setItem('sh_catalog_adopted', JSON.stringify(ADOPTED));
  localStorage.setItem('sh_catalog_removed', JSON.stringify(REMOVED));
  rebuildCat();
}
/* current standard/default price for a catalog id (adopted edit wins over CSV) */
function baseCost(id){
  const c = CAT[id];
  if (!c) return 0;
  return ADOPTED[id] !== undefined ? ADOPTED[id] : c.cost;
}

const LS = { projects:'sh_projects', active:'sh_active_project', prices:'sh_catalog_overrides', route:'sh_route' };
const uid = p => p + '_' + Math.random().toString(36).slice(2,10);

const Store = {
  projects: [], activeId: null, globalPrices: {},
  load(){
    try { this.projects = JSON.parse(localStorage.getItem(LS.projects)) || []; } catch(e){ this.projects = []; }
    try { this.globalPrices = JSON.parse(localStorage.getItem(LS.prices)) || {}; } catch(e){ this.globalPrices = {}; }
    this.activeId = localStorage.getItem(LS.active) || null;
    if (!Array.isArray(this.projects)) this.projects = [];
  },
  save(){
    try {
      localStorage.setItem(LS.projects, JSON.stringify(this.projects));
      localStorage.setItem(LS.prices, JSON.stringify(this.globalPrices));
      if (this.activeId) localStorage.setItem(LS.active, this.activeId); else localStorage.removeItem(LS.active);
    } catch(e) { toast('Storage full — remove some photos'); }
  },
  active(){ return this.projects.find(p => p.id === this.activeId) || null; },

  makeItem(catalogId){
    const c = CAT[catalogId];
    return { id: uid('li'), catalogId, name:c.name, unit:c.unit, unitCost:baseCost(catalogId), qty:0, overrideCost:null };
  },
  makeRoom(type, num){
    const def = ROOM_TYPES[type]; const groups = {};
    for (const [g, ids] of Object.entries(def.groups))
      groups[g] = { noAction:false, items: ids.filter(id => !REMOVED.includes(id)).map(id => this.makeItem(id)) };
    for (const c of CUSTOM_CATALOG)
      if (c.roomType === type && groups[c.group]) groups[c.group].items.push(this.makeItem(c.id));
    return { id: uid('rm'), type, instanceNum:num, label: def.multi ? type + ' ' + num : type, groups };
  },
  addCustomRoom(name){
    const p = this.active();
    const r = { id: uid('rm'), type:'__custom', instanceNum:1, label: name,
                groups: { 'Repairs': { noAction:false, items: [] } } };
    p.rooms.push(r); this.save(); return r;
  },
  createProject(name){
    const rooms = [];
    for (const t of SEED_ORDER) rooms.push(this.makeRoom(t, 1));
    const p = { id: uid('p'), name: name || 'Untitled property', address:'', sqft:'', yearBuilt:'', budget:'',
                generalNote:'', coverId:null, coverAsked:false, createdAt: Date.now(), rooms, photos: [] };
    this.projects.unshift(p); this.activeId = p.id; this.save(); return p;
  },
  deleteProject(id){
    this.projects = this.projects.filter(p => p.id !== id);
    if (this.activeId === id) this.activeId = null;
    this.save();
  },
  /* clone carries rooms + quantities + price overrides only */
  duplicateProject(id){
    const src = this.projects.find(p => p.id === id);
    if (!src) return null;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid('p');
    copy.name = src.name + ' (copy)';
    copy.createdAt = Date.now();
    copy.photos = []; copy.coverId = null; copy.coverAsked = false; copy.generalNote = '';
    for (const r of copy.rooms) { delete r._open; for (const g of Object.values(r.groups)) { delete g.note; delete g.grade; } }
    this.projects.unshift(copy); this.save(); return copy;
  },
  addRoom(type){
    const p = this.active();
    const n = p.rooms.filter(r => r.type === type).length + 1;
    const r = this.makeRoom(type, n); p.rooms.push(r); this.save(); return r;
  },
  removeRoom(roomId){
    const p = this.active();
    p.rooms = p.rooms.filter(r => r.id !== roomId);
    for (const t of Object.keys(ROOM_TYPES).filter(t => ROOM_TYPES[t].multi)) {
      let n = 1;
      for (const r of p.rooms) if (r.type === t) { r.instanceNum = n; r.label = t + ' ' + n; n++; }
    }
    this.save();
  },

  /* price resolution: project override → global tweak → adopted default → snapshot */
  cost(item){
    if (item.overrideCost !== null && item.overrideCost !== undefined) return item.overrideCost;
    if (item.catalogId) {
      if (this.globalPrices[item.catalogId] !== undefined) return this.globalPrices[item.catalogId];
      if (ADOPTED[item.catalogId] !== undefined) return ADOPTED[item.catalogId];
    }
    return item.unitCost;
  },
  groupTotal(g){ return g.noAction ? 0 : g.items.reduce((s,i) => s + this.cost(i) * (i.qty||0), 0); },
  roomTotal(r){ return Object.values(r.groups).reduce((s,g) => s + this.groupTotal(g), 0); },
  projectTotal(p){ return p.rooms.reduce((s,r) => s + this.roomTotal(r), 0); },
  progress(p){
    let total=0, done=0;
    for (const r of p.rooms) for (const g of Object.values(r.groups)) {
      total++;
      if (g.noAction || g.items.some(i => i.qty > 0)) done++;
    }
    return { done, total, pct: total ? Math.round(done/total*100) : 0 };
  },
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}
function loadScript(url){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${url}"]`)) return res();
    const s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + url));
    document.head.appendChild(s);
  });
}

/* modal helper */
function showModal(html){
  const host = document.getElementById('modalhost');
  host.innerHTML = `<div id="modalwrap"><div class="modal">${html}</div></div>`;
  host.querySelector('#modalwrap').addEventListener('click', e => { if (e.target.id === 'modalwrap') closeModal(); });
  return host.querySelector('.modal');
}
function closeModal(){ document.getElementById('modalhost').innerHTML = ''; }
function confirmModal(title, body){
  return new Promise(res => {
    const m = showModal(`<h3>${esc(title)}</h3><p class="muted" style="font-size:14px">${esc(body)}</p>
      <div class="mrow"><button class="btn ghost" data-a="no">Cancel</button><button class="btn primary" style="background:var(--color-danger)" data-a="yes">Delete</button></div>`);
    m.querySelector('[data-a=no]').onclick = () => { closeModal(); res(false); };
    m.querySelector('[data-a=yes]').onclick = () => { closeModal(); res(true); };
  });
}

/* ════════════════════════════ Router ═════════════════════════════ */
/* Route lives in sessionStorage: an accidental mid-walkthrough refresh keeps your
   place, but closing the tab and reopening starts fresh at the home screen. */
let route = { screen:'projects', roomId:null };
try { const r = JSON.parse(sessionStorage.getItem(LS.route)); if (r && r.screen) route = r; } catch(e){}
function go(screen, roomId){
  route = { screen, roomId: roomId || null };
  try { sessionStorage.setItem(LS.route, JSON.stringify(route)); } catch(e){}
  render();
}

/* ════════════════════════════ Renderers ══════════════════════════ */
const $hdr = () => document.getElementById('hdr');
const $app = () => document.getElementById('app');
const $tb  = () => document.getElementById('totalbar');

let _lastRenderKey = '';
function render(){
  const p = Store.active();
  if (!p && route.screen !== 'projects' && route.screen !== 'settings') route.screen = 'projects';
  const key = route.screen + ':' + (route.roomId || '');
  const y = window.scrollY;
  ({ projects: renderProjects, intake: renderIntake, walkthrough: renderWalk, room: renderWalk,
     photos: renderPhotos, summary: renderSummary, settings: renderSettings }[route.screen] || renderProjects)();
  if (key === _lastRenderKey) window.scrollTo(0, y); // same-screen re-render keeps scroll position
  _lastRenderKey = key;
}

function setHeader(html){ $hdr().innerHTML = html; }
function setTotalbar(show){
  const p = Store.active(); const tb = $tb();
  if (!show || !p) { tb.style.display = 'none'; return; }
  tb.style.display = 'flex';
  const total = Store.projectTotal(p);
  const budget = parseFloat(p.budget);
  let cls = '', sub = '';
  if (budget > 0) {
    const pct = Math.round(total / budget * 100);
    sub = `<span class="sublbl">${pct}% of ${fmt(budget)} budget</span>`;
    if (total > budget) cls = 'over'; else if (pct >= 80) cls = 'warn';
  }
  tb.className = 'totalbar ' + cls;
  tb.innerHTML = `<span class="lbl">Running total${sub}</span><span class="amt">${fmt(total)}</span>`;
  tb.onclick = () => go('summary');
}

/* ── Projects home ── */
function renderProjects(){
  setHeader(`<span class="ttl">Repair Estimator</span>
    <button class="icbtn" data-nav="settings" aria-label="Global pricing settings">${ICONS.gear}</button>`);
  setTotalbar(false);
  const cards = Store.projects.map(p => {
    const cover = p.coverId && p.photos.find(x => x.id === p.coverId);
    return `
    <div class="card pcard" data-open="${p.id}" role="button" tabindex="0">
      ${cover ? `<img class="cover" src="${cover.dataUrl}" alt="">` : ''}
      <div style="flex:1;min-width:0">
        <div class="pn">${esc(p.name)}</div>
        <div class="pa">${esc(p.address || 'No address')} · ${new Date(p.createdAt).toLocaleDateString()}</div>
      </div>
      <span class="pt">${fmt(Store.projectTotal(p))}</span>
      <button class="rm-x" data-duplicate="${p.id}" aria-label="Duplicate project">${ICONS.copy}</button>
      <button class="rm-x" data-delproj="${p.id}" aria-label="Delete project">${ICONS.trash}</button>
    </div>`; }).join('');
  $app().innerHTML = `
    <div class="hero"><img src="${LOGO_SRC}" alt="Spark Group"><div class="tag">Walk the property, log repairs room by room, get a cost estimate.</div></div>
    <div class="pad">
      ${Store.projects.length ? `<p class="eyebrow">Projects</p>${cards}` : `<p class="muted" style="text-align:center;padding:12px 0">No projects yet. Start your first walkthrough.</p>`}
      <button class="btn dashed" data-newproj style="margin-top:8px">${ICONS.plus} New project</button>
    </div>`;
}

/* ── Intake ── */
function renderIntake(){
  const p = Store.active();
  setHeader(`<button class="icbtn" data-nav="projects">${ICONS.back}</button><span class="ttl">Property details</span>`);
  setTotalbar(false);
  $app().innerHTML = `
    <div class="pad" style="display:flex;flex-direction:column;gap:16px;max-width:520px">
      <label class="field"><span>Project name</span><input id="f-name" value="${esc(p.name)}" placeholder="123 Maple St flip"></label>
      <label class="field"><span>Address</span><input id="f-addr" value="${esc(p.address)}" placeholder="123 Maple St"></label>
      <div style="display:flex;gap:12px">
        <label class="field"><span>Sq ft</span><input id="f-sqft" type="number" value="${esc(p.sqft)}" placeholder="1800"></label>
        <label class="field"><span>Year built</span><input id="f-year" type="number" value="${esc(p.yearBuilt)}" placeholder="1974"></label>
      </div>
      <label class="field"><span>Repair budget $ (optional)</span><input id="f-budget" type="number" inputmode="decimal" value="${esc(p.budget || '')}" placeholder="25000"></label>
      <label class="field"><span>General notes</span><textarea id="f-gnote" class="notearea" placeholder="Access, occupancy, overall condition…">${esc(p.generalNote || '')}</textarea></label>
      <button class="btn primary" data-nav="walkthrough" style="margin-top:8px">Start walkthrough</button>
    </div>`;
  for (const [id, key] of [['f-name','name'],['f-addr','address'],['f-sqft','sqft'],['f-year','yearBuilt'],['f-budget','budget'],['f-gnote','generalNote']])
    document.getElementById(id).addEventListener('input', e => { p[key] = e.target.value; Store.save(); });
}

/* ── Walkthrough + Room detail (two-pane on desktop) ── */
function renderWalk(){
  const p = Store.active();
  const room = route.roomId ? p.rooms.find(r => r.id === route.roomId) : null;
  const showRoomPane = route.screen === 'room' && room;
  const prog = Store.progress(p);
  setHeader(showRoomPane
    ? `<button class="icbtn mobile-only" data-nav="walkthrough">${ICONS.back}</button>
       <button class="icbtn desk-only" data-nav="projects">${ICONS.home}</button>

    return `<div class="group ${complete && !g.noAction ? 'done' : ''} ${g.noAction ? 'noact' : ''} ${open ? 'open' : ''}" data-group="${esc(gname)}">

/* ════════════════════════════ Photo capture + OCR ════════════════ */
function capturePhotos(files, opts){
  opts = opts || {};
  const p = Store.active();
  let first = true;
  for (const file of files) {
    const isFirstOfBatch = first; first = false;
    const reader = new FileReader();
    reader.onload = ev => {
      downscale(ev.target.result, 1280, dataUrl => {
        const ph = { id: uid('ph'), dataUrl, name: file.name, ts: Date.now(), serial: null, ocr: 'pending' };
        p.photos.push(ph);
        if (opts.asCover && isFirstOfBatch) { p.coverId = ph.id; p.coverAsked = true; }
        Store.save();
        if (route.screen === 'photos') render();
        // one-time prompt on the very first project photo: is this the house shot?
        if (!opts.asCover && !p.coverAsked && p.photos.length === 1) {
          p.coverAsked = true; Store.save();
          const m = showModal(`<h3>House photo?</h3>
            <p class="muted" style="font-size:14px">Use this photo as the project's cover on the home screen?</p>
            <img src="${dataUrl}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:var(--radius-sm);margin-top:8px">
            <div class="mrow"><button class="btn ghost" data-a="no">No</button><button class="btn primary" data-a="yes">Yes, use it</button></div>`);
          m.querySelector('[data-a=no]').onclick = closeModal;
          m.querySelector('[data-a=yes]').onclick = () => { p.coverId = ph.id; Store.save(); closeModal(); render(); };
        }
        runOCR(ph);
      });
    };
    reader.readAsDataURL(file);
  }
}
let _nextIsCover = false;
function downscale(src, max, cb){
  const img = new Image();
  img.onload = () => {
    let { width: w, height: h } = img;
    if (w > max || h > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(cv.toDataURL('image/jpeg', 0.72));
  };
  img.onerror = () => cb(src);
  img.src = src;
}
let _tessWorker = null;
async function getTess(){
  if (_tessWorker) return _tessWorker;
  await loadScript(CDN.tesseract);
  _tessWorker = await Tesseract.createWorker('eng');
  // data plates are uppercase + digits — constraining the charset cuts misreads
  await _tessWorker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/#:. ' });
  return _tessWorker;
}
/* Line-aware serial extraction. Priority:
   1. token on a line carrying a serial label (S/N, SERIAL, SER NO — with common
      OCR confusions tolerated: 5↔S, 1/l↔I, 0↔O)
   2. token on the line right after a serial label
   3. any token NOT on a model/part/product line, preferring digit-heavy tokens
      (serials are mostly numeric; model numbers are letter-heavy) */
function extractSerial(text){
  const lines = (text || '').toUpperCase().split(/\n+/).map(l => l.trim()).filter(Boolean);
  const SER = /(?:\bS\s*\/?\s*N\b|[S5]ER[Il1]?[AL4]?L?\s*(?:N[O0]\.?|NUMBER|#)?|\bSERIAL\b)/;
  const MODEL = /MODEL|MDL|PROD|PART|P\s*\/\s*N|CAT\s*(?:NO|#)|MFR|TYPE/;
  // electrical/physical spec lines — voltages, amps, pressures etc. are never serials
  const SPEC = /VOLT|VAC|\bV\b|\bHZ\b|PHASE|\bPH\b|AMP|\bA\b|WATT|\bW\b|\bKW\b|PSI|KPA|RLA|FLA|LRA|\bHP\b|BTU|LBS?\b|\bKG\b|\bMIN\b|\bMAX\b|CHARGE|SUPPLY|COOLING|PRESSURE|CIRCUIT|FUSE|BREAKER|REFRIGERANT|R-?\d{2,3}[A-Z]?\b/;
  // spec-shaped tokens: 208-230, 115/230, 60HZ style fragments, pure short numbers
  const SPECTOKEN = /^\d{2,3}[-/]\d{2,3}$|^\d{1,4}$|^R-?\d{2,3}[A-Z]?$/;
  const tokens = (s, minLen) => (s.match(/\b(?=[A-Z0-9\-]*\d)[A-Z0-9][A-Z0-9\-]{5,19}\b/g) || [])
    .filter(t => t.length >= minLen && !SPECTOKEN.test(t));
  const digitScore = t => t.replace(/[^0-9]/g, '').length / t.length;

  for (const ln of lines)
    if (SER.test(ln) && !MODEL.test(ln)) {
      const t = tokens(ln.replace(SER, ' '), 6);
      if (t.length) return { value: t[0], tier: 1 };
    }
  for (let i = 0; i < lines.length; i++)
    if (SER.test(lines[i])) {
      const t = tokens(lines[i].replace(SER, ' '), 6).concat(tokens(lines[i + 1] || '', 6));
      if (t.length) return { value: t[0], tier: 2 };
    }
  const cands = [];
  for (const ln of lines) { if (MODEL.test(ln) || SPEC.test(ln)) continue; cands.push(...tokens(ln, 8)); }
  cands.sort((a, b) => (digitScore(b) - digitScore(a)) || (b.length - a.length));
  return cands.length ? { value: cands[0], tier: 3 } : { value: null, tier: 9 };
}
/* Upscale + grayscale + contrast before OCR — data plates photographed at an
   angle in bad light read far better this way. Falls back to the original. */
function preprocessForOCR(dataUrl){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(2, 2000 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * Math.max(1, k));
        cv.height = Math.round(img.height * Math.max(1, k));
        const ctx = cv.getContext('2d');
        ctx.filter = 'grayscale(1) contrast(1.7)';
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/png'));
      } catch(e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
async function runOCR(ph){
  try {
    const w = await getTess();
    const prepped = await preprocessForOCR(ph.dataUrl);
    const r1 = extractSerial((await w.recognize(prepped)).data.text || '');
    let best = r1;
    if (r1.tier > 1) { // no confident label hit — second pass on the raw image
      const r2 = extractSerial((await w.recognize(ph.dataUrl)).data.text || '');
      if (r2.tier < r1.tier || (!r1.value && r2.value)) best = r2;
    }
    ph.serial = best.value;
  } catch(e) { ph.serial = null; }
  ph.ocr = 'done'; Store.save();
  if (route.screen === 'photos') render();
}

/* ════════════════════════════ Export (ZIP: xlsx + photos) ════════ */
async function exportZip(){
  const p = Store.active();
  toast('Building export…');
  try {
    await Promise.all([loadScript(CDN.jszip), loadScript(CDN.xlsx)]);
    const wb = XLSX.utils.book_new();
    /* ── shared styles (xlsx-js-style) ── */
    const BR = { style:'thin', color:{ rgb:'C9C2B8' } };
    const BORDER = { top:BR, bottom:BR, left:BR, right:BR };
    const ST = {
      title: { font:{ sz:16, bold:true, color:{ rgb:'8C3B26' } } },
      label: { font:{ bold:true, color:{ rgb:'6B655F' } } },
      head:  { font:{ bold:true, sz:11, color:{ rgb:'F7F2EA' } }, fill:{ fgColor:{ rgb:'3A3532' } },
               border:BORDER, alignment:{ horizontal:'center', vertical:'center' } },
      cell:  { border:BORDER },
      money: { border:BORDER, numFmt:'"$"#,##0.00' },
      total: { font:{ bold:true, sz:12, color:{ rgb:'8C3B26' } }, border:BORDER, numFmt:'"$"#,##0.00',
               fill:{ fgColor:{ rgb:'EFE7D9' } } },
      totalLbl: { font:{ bold:true, sz:12 }, border:BORDER, fill:{ fgColor:{ rgb:'EFE7D9' } } },
      note: { font:{ italic:true, color:{ rgb:'6B655F' } }, fill:{ fgColor:{ rgb:'F3EDE3' } }, border:BORDER },
    };
    const applyRow = (ws, r, styles) => styles.forEach((s, c) => {
      const ref = XLSX.utils.encode_cell({ r, c });
      if (ws[ref] && s) ws[ref].s = s;
    });

    /* Summary sheet */
    const budget = parseFloat(p.budget);
    const sum = [['Spark Group — Repair Estimate'], [],
      ['Project', p.name], ['Address', p.address], ['Sq Ft', p.sqft], ['Year Built', p.yearBuilt]];
    const budgetRow = budget > 0 ? (sum.push(['Budget', budget]), sum.length - 1) : -1;
    const gnoteRow = p.generalNote ? (sum.push(['General notes', p.generalNote]), sum.length - 1) : -1;
    sum.push(['Exported', new Date().toLocaleString()], []);
    const headRow = sum.length; sum.push(['Room', 'Subtotal']);
    const roomRows = [];
    for (const r of p.rooms) { const t = Store.roomTotal(r); if (t > 0) { sum.push([r.label, t]); roomRows.push(sum.length - 1); } }
    sum.push(['TOTAL', Store.projectTotal(p)]);
    const totalRow = sum.length - 1;
    /* condition scorecard */
    const graded = [];
    for (const r of p.rooms) for (const [gname, g] of Object.entries(r.groups))
      if (g.grade) graded.push([r.label + ' → ' + gname, g.grade]);
    let condHead = -1;
    if (graded.length) {
      sum.push([]); condHead = sum.length; sum.push(['Condition scorecard', 'Grade']);
      for (const row of graded) sum.push(row);
    }
    const wsS = XLSX.utils.aoa_to_sheet(sum);
    wsS['!cols'] = [{ wch:30 }, { wch:30 }];
    wsS['A1'].s = ST.title;
    for (const r of [2,3,4,5]) applyRow(wsS, r, [ST.label, null]);
    if (budgetRow > -1) { applyRow(wsS, budgetRow, [ST.label, null]); const ref = XLSX.utils.encode_cell({ r:budgetRow, c:1 }); if (wsS[ref]) wsS[ref].z = '"$"#,##0.00'; }
    if (gnoteRow > -1) applyRow(wsS, gnoteRow, [ST.label, ST.note]);
    applyRow(wsS, headRow, [ST.head, ST.head]);
    for (const r of roomRows) applyRow(wsS, r, [ST.cell, ST.money]);
    applyRow(wsS, totalRow, [ST.totalLbl, ST.total]);
    if (condHead > -1) {
      applyRow(wsS, condHead, [ST.head, ST.head]);
      for (let r = condHead + 1; r < sum.length; r++) applyRow(wsS, r, [ST.cell, ST.cell]);
    }
    XLSX.utils.book_append_sheet(wb, wsS, 'Summary');

    /* Line Items sheet — group notes ride inline, right under their group's rows */
    const li = [['Room', 'Group', 'Item ID', 'Item', 'Qty', 'Unit', 'Unit Cost', 'Line Total']];
    const noteRows = [];
    for (const r of p.rooms) for (const [gname, g] of Object.entries(r.groups)) {
      if (g.noAction) { if (g.note) { li.push([r.label, gname, '', 'Note: ' + g.note, '', '', '', '']); noteRows.push(li.length - 1); } continue; }
      let pushed = false;
      for (const i of g.items) if (i.qty > 0) {
        li.push([r.label, gname, i.catalogId || 'custom', i.name, i.qty, i.unit, Store.cost(i), Store.cost(i) * i.qty]);
        pushed = true;
      }
      if (g.note) { li.push([pushed ? '' : r.label, pushed ? '' : gname, '', 'Note: ' + g.note, '', '', '', '']); noteRows.push(li.length - 1); }
    }
    li.push(['', '', '', '', '', '', 'TOTAL', Store.projectTotal(p)]);
    const wsL = XLSX.utils.aoa_to_sheet(li);
    wsL['!cols'] = [{ wch:22 }, { wch:20 }, { wch:9 }, { wch:44 }, { wch:7 }, { wch:10 }, { wch:12 }, { wch:13 }];
    applyRow(wsL, 0, Array(8).fill(ST.head));
    for (let r = 1; r < li.length - 1; r++)
      applyRow(wsL, r, noteRows.includes(r) ? Array(8).fill(ST.note)
        : [ST.cell, ST.cell, ST.cell, ST.cell, ST.cell, ST.cell, ST.money, ST.money]);
    applyRow(wsL, li.length - 1, [ST.cell, ST.cell, ST.cell, ST.cell, ST.cell, ST.cell, ST.totalLbl, ST.total]);
    XLSX.utils.book_append_sheet(wb, wsL, 'Line Items');

    /* Photos sheet */
    if (p.photos.length) {
      const ps = [['Filename', 'Serial Number', 'Captured']];
      p.photos.forEach((ph, k) => ps.push([`photos/photo-${String(k + 1).padStart(2, '0')}.jpg`, ph.serial || '', new Date(ph.ts).toLocaleString()]));
      const wsP = XLSX.utils.aoa_to_sheet(ps);
      wsP['!cols'] = [{ wch:24 }, { wch:20 }, { wch:22 }];
      applyRow(wsP, 0, Array(3).fill(ST.head));
      for (let r = 1; r < ps.length; r++) applyRow(wsP, r, Array(3).fill(ST.cell));
      XLSX.utils.book_append_sheet(wb, wsP, 'Photos');
    }

    const xbuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const zip = new JSZip();
    zip.file('estimate.xlsx', xbuf);
    p.photos.forEach((ph, k) => zip.file(`photos/photo-${String(k + 1).padStart(2, '0')}.jpg`, ph.dataUrl.split(',')[1], { base64: true }));
    const blob = await zip.generateAsync({ type: 'blob' });
    const slug = (p.name || 'estimate').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'estimate';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = slug + '-estimate.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast('Export downloaded');
  } catch(e) { console.error(e); toast('Export failed — check connection and retry'); }
}

      </div>
      <div class="mrow"><button class="btn ghost" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Set quantity</button></div>`);
    m.querySelector('[data-a=c]').onclick = closeModal;
    m.querySelector('[data-a=ok]').onclick = () => {

    if (gaps.length) {
      const bigs = gaps.filter(g => g.big);
      const m = showModal(`<h3>${gaps.length} group${gaps.length === 1 ? '' : 's'} not reviewed</h3>
        <p class="muted" style="font-size:14px">${bigs.length ? `Including ${bigs.length} big-ticket: ${esc(bigs.slice(0, 3).map(g => g.group).join(', '))}${bigs.length > 3 ? '…' : ''}. ` : ''}Unreviewed groups export as $0.</p>
        <div class="mrow"><button class="btn ghost" data-a="rev">Review gaps</button><button class="btn primary" data-a="go">Export anyway</button></div>`);
      m.querySelector('[data-a=rev]').onclick = closeModal;
      m.querySelector('[data-a=go]').onclick = () => { closeModal(); exportZip(); };
    } else exportZip();
    return;
  }
  if ((n = el('[data-reset]'))) { delete Store.globalPrices[n.dataset.reset]; Store.save(); render(); return; }
});

document.addEventListener('change', e => {
  let n;
  if ((n = e.target.closest('[data-noaction]'))) {
    const room = Store.active().rooms.find(r => r.id === route.roomId);
    room.groups[n.dataset.noaction].noAction = n.checked;
    Store.save(); render(); return;
  }
  if ((n = e.target.closest('[data-qty]'))) {
    const { item } = findItem(e);
    // dimension math: "12x14" (or 12*14 / 12×14) becomes 168
    const raw = String(n.value).trim();
    const dim = raw.match(/^(\d+\.?\d*)\s*[x×*]\s*(\d+\.?\d*)$/i);
    item.qty = Math.max(0, dim ? parseFloat(dim[1]) * parseFloat(dim[2]) : (parseFloat(raw) || 0));
    Store.save(); render(); return;
  }
  if ((n = e.target.closest('[data-gprice]'))) {
    const id = n.dataset.gprice; const v = parseFloat(n.value);
    if (isNaN(v) || v < 0) { render(); return; }
    const cc = CUSTOM_CATALOG.find(x => x.id === id);
    const def = cc ? cc.cost : baseCost(id);
    if (Math.abs(v - def) < 0.005) delete Store.globalPrices[id];
    else Store.globalPrices[id] = v;
    Store.save(); render(); return;
  }
});

for (const inputId of ['photoinput', 'photoinput-gallery'])
  document.getElementById(inputId).addEventListener('change', e => {
    if (e.target.files && e.target.files.length) capturePhotos([...e.target.files], { asCover: _nextIsCover });
    _nextIsCover = false;
    e.target.value = '';
  });

function findItem(e){
  const itemEl = e.target.closest('[data-item]');
  const room = Store.active().rooms.find(r => r.id === route.roomId);
  const group = room.groups[itemEl.dataset.g];
  const item = group.items.find(i => i.id === itemEl.dataset.item);
  return { room, group, item };
}

/* add-item modal: catalog picker + custom */
function openAddItem(gname){
  const room = Store.active().rooms.find(r => r.id === route.roomId);
  const group = room.groups[gname];
  const present = new Set(group.items.map(i => i.catalogId).filter(Boolean));
  const avail = fullCatalog().filter(c => !present.has(c.id));
  const optionsFor = q => avail
    .filter(c => !q || c.name.toUpperCase().includes(q))
    .map(c => `<option value="${c.id}">${esc(c.name)} — ${fmt(c.cost)} / ${esc(c.unit)}</option>`).join('');
  const m = showModal(`<h3>Add item — ${esc(gname)}</h3>
    <div class="tabs"><button class="on" data-tab="cat">From catalog</button><button data-tab="cus">Custom</button></div>
    <div id="tab-cat">
      <div class="searchbar">${ICONS.search}<input id="ai-search" placeholder="Search catalog…" autocomplete="off"></div>
      <select id="ai-cat" size="8" style="height:auto;margin-top:0">${optionsFor('')}</select>
    </div>
    <div id="tab-cus" style="display:none;flex-direction:column;gap:10px">
      <label class="field"><span>Item name</span><input id="ai-name" placeholder="e.g. Pool repair"></label>
      <div style="display:flex;gap:10px">
        <label class="field"><span>Unit</span><input id="ai-unit" placeholder="ea." value="ea."></label>
        <label class="field"><span>Unit cost $</span><input id="ai-cost" type="number" step="0.01" inputmode="decimal" placeholder="0"></label>
      </div>
    </div>
    <div class="mrow"><button class="btn ghost" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Add</button></div>`);
  let tab = 'cat';
  m.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    m.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
    m.querySelector('#tab-cat').style.display = tab === 'cat' ? 'block' : 'none';
    m.querySelector('#tab-cus').style.display = tab === 'cus' ? 'flex' : 'none';
  });
  m.querySelector('#ai-search').addEventListener('input', e => {
    m.querySelector('#ai-cat').innerHTML = optionsFor(e.target.value.trim().toUpperCase());
  });
  m.querySelector('[data-a=c]').onclick = closeModal;
  m.querySelector('[data-a=ok]').onclick = () => {
    if (tab === 'cat') {
      const id = m.querySelector('#ai-cat').value;
      if (!id) return;
      const it = Store.makeItem(id); it.qty = 1; group.items.push(it);
    } else {
      const name = m.querySelector('#ai-name').value.trim();
      if (!name) return;
      group.items.push({ id: uid('li'), catalogId: null, name,
        unit: m.querySelector('#ai-unit').value.trim() || 'ea.',
        unitCost: parseFloat(m.querySelector('#ai-cost').value) || 0, qty: 1, overrideCost: null });
    }
    closeModal(); Store.save(); render();
  };
}

/* edit an existing custom price-list item */
function openEditCustom(id){
  const c = CUSTOM_CATALOG.find(x => x.id === id);
  if (!c) return;
  const groupOpts = (t, sel) => Object.keys(ROOM_TYPES[t].groups)
    .map(g => `<option ${g === sel ? 'selected' : ''}>${esc(g)}</option>`).join('');
  const m = showModal(`<h3>Edit price-list item</h3>
    <p class="muted" style="font-size:13px">Changes apply to new rooms/projects. Copies already inside projects keep their own settings.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <label class="field"><span>Item name</span><input id="ec-name" value="${esc(c.name)}"></label>
      <div style="display:flex;gap:10px">
        <label class="field"><span>Unit</span><input id="ec-unit" value="${esc(c.unit)}"></label>
        <label class="field"><span>Unit cost $</span><input id="ec-cost" type="number" step="0.01" inputmode="decimal" value="${c.cost}"></label>
      </div>
      <label class="field"><span>Room type</span><select id="ec-type" style="margin-top:0;height:var(--tap);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0 10px;background:var(--bg-surface)">
        ${Object.keys(ROOM_TYPES).map(t => `<option ${t === c.roomType ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="field"><span>Group</span><select id="ec-group" style="margin-top:0;height:var(--tap);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0 10px;background:var(--bg-surface)">
        ${groupOpts(c.roomType, c.group)}</select></label>
    </div>
    <div class="mrow"><button class="btn ghost" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Save</button></div>`);
  m.querySelector('#ec-type').addEventListener('change', ev => {
    m.querySelector('#ec-group').innerHTML = groupOpts(ev.target.value, '');
  });
  m.querySelector('[data-a=c]').onclick = closeModal;
  m.querySelector('[data-a=ok]').onclick = () => {
    const name = m.querySelector('#ec-name').value.trim();
    if (!name) return;
    c.name = name;
    c.unit = m.querySelector('#ec-unit').value.trim() || 'ea.';
    c.cost = parseFloat(m.querySelector('#ec-cost').value) || 0;
    c.roomType = m.querySelector('#ec-type').value;
    c.group = m.querySelector('#ec-group').value;
    delete Store.globalPrices[c.id];
    saveCustomCatalog(); Store.save(); closeModal(); render(); toast('Item updated');
  };
}

/* ════════════════════════════ Boot ═══════════════════════════════ */
Store.load();
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
